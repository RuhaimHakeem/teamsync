services:
  postgres:
    image: postgres:16-alpine
    container_name: teamsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamsync
      POSTGRES_USER: teamsync
      POSTGRES_PASSWORD: teamsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamsync -d teamsync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

